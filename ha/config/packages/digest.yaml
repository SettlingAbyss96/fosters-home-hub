# The digest on the Hub (hub/hub_digest.py, installed by host/58-digest.sh): what Jarvis talks about
# in the welcome home and the morning briefing. It reads the sources in hub/digest.toml on its own
# schedule and hands over a kit of things nobody's said yet (script.welcome_home_prepare,
# script.morning_briefing_prepare). Once you've heard it, the kit goes back and everything in it is
# retired for good, so nothing comes up twice, morning or evening.
#
# The Hub's address from house.toml (input_text.hub_address) rather than its name, for the reason
# the speech engines use it: mDNS lookups fail now and then. Port 10230 only answers the Home
# Assistant VM
rest_command:
  digest_kit:
    url: >-
      http://{{ states('input_text.hub_address') }}:10230/kit?for={{ occasion | default('welcome') }}&late={{ late | default(0) }}&name={{ name | default('') | urlencode }}
    method: get
    timeout: 8
  digest_told:
    url: "http://{{ states('input_text.hub_address') }}:10230/told"
    method: post
    content_type: "application/json"
    payload: '{{ {"kit": kit, "words": words} | to_json }}'
    timeout: 8
  # what you thought of the last thing it said: +1 liked, -1 not (custom_sentences/en/digest.yaml)
  digest_feedback:
    url: "http://{{ states('input_text.hub_address') }}:10230/feedback"
    method: post
    content_type: "application/json"
    payload: '{{ {"y": y} | to_json }}'
    timeout: 8

intent_script:
  DigestMore:
    description: "The listener liked what Jarvis just told them: more like that."
    action:
      - action: rest_command.digest_feedback
        continue_on_error: true
        data:
          y: 1
    speech:
      text: "Noted. More like that."
  DigestLess:
    description: "The listener wasn't interested in what Jarvis just told them: less like that."
    action:
      - action: rest_command.digest_feedback
        continue_on_error: true
        data:
          y: -1
    speech:
      text: "Noted. Less of that."
