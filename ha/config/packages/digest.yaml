# The digest on the Hub (hub/hub_digest.py, installed by host/58-digest.sh): what Jarvis talks about
# in the welcome home. It reads the sources in hub/digest.toml on its own schedule and hands over a
# kit of things nobody's said yet (packages/presence.yaml, script.welcome_home_prepare). Once you've
# heard it, the kit goes back (script.welcome_home) and everything in it is retired for good, so
# nothing comes up twice.
#
# The Hub's address from house.toml (input_text.hub_address) rather than its name, for the reason
# the speech engines use it: mDNS lookups fail now and then. Port 10230 only answers the Home
# Assistant VM
rest_command:
  digest_kit:
    url: >-
      http://{{ states('input_text.hub_address') }}:10230/kit?for=welcome&late={{ late | default(0) }}&name={{ name | default('') | urlencode }}
    method: get
    timeout: 8
  digest_told:
    url: "http://{{ states('input_text.hub_address') }}:10230/told"
    method: post
    content_type: "application/json"
    payload: '{{ {"kit": kit, "words": words} | to_json }}'
    timeout: 8
