# The Klipper printer by voice (Moonraker, named "Klipper" in Home Assistant, packages/printers.yaml):
# one answer that says what it's doing, how far along, and how long is left, instead of four
# separate questions. States are Moonraker's print_stats: standby, printing, paused, complete,
# cancelled, error. Temperatures stay in Celsius, because nobody slices in Fahrenheit (a Home
# Assistant in US units shows the targets in Fahrenheit, so those get converted back).
# Sentences: custom_sentences/en/klipper.yaml
intent_script:
  KlipperStatus:
    speech:
      text: >-
        {% set state = states('sensor.klipper_current_print_state') %}
        {% set pct = states('sensor.klipper_progress') | float(0) | round(0) | int %}
        {% set left = states('sensor.klipper_print_time_left') | float(0) %}
        {% set h = left | int %}{% set m = ((left - h) * 60) | round(0) | int %}
        {% set left_txt = (h ~ ' hour' ~ ('s' if h != 1 else '') ~ (' ' if m else '') if h else '')
                          ~ (m ~ ' minute' ~ ('s' if m != 1 else '') if m or not h else '') %}
        {% set file = states('sensor.klipper_filename') | replace('.gcode', '') | replace('_', ' ') %}
        {% if state == 'printing' %}
          The Klipper printer is printing{{ ' ' ~ file if file not in ['', 'unknown', 'unavailable'] }}, {{ pct }} percent done, about {{ left_txt }} left.
        {% elif state == 'paused' %}
          The Klipper printer is paused at {{ pct }} percent.
        {% elif state == 'complete' %}
          The Klipper printer is done{{ ', ' ~ file ~ ' finished' if file not in ['', 'unknown', 'unavailable'] }}.
        {% elif state == 'cancelled' %}
          The last print on the Klipper printer was cancelled.
        {% elif state == 'error' %}
          The Klipper printer has an error: {{ states('sensor.klipper_printer_message') }}
        {% elif state in ['unknown', 'unavailable'] %}
          I can't reach the Klipper printer right now.
        {% else %}
          The Klipper printer is idle. The bed is at {{ states('sensor.klipper_bed_temperature') | float(0) | round(0) | int }} degrees.
        {% endif %}

  KlipperTemps:
    speech:
      text: >-
        {% set part = klipper_part | default('') %}
        {% set t = {'nozzle': 'sensor.klipper_extruder_temperature', 'bed': 'sensor.klipper_bed_temperature',
                    'chamber': 'sensor.klipper_chamber_heater_temperature'} %}
        {% set targets = {'nozzle': 'number.klipper_extruder_target', 'bed': 'number.klipper_bed_target',
                          'chamber': 'number.klipper_chamber_heater_target'} %}
        {% macro one(p) %}{% set now = states(t[p]) | float(0) | round(0) | int %}{% set goal = states(targets[p]) | float(0) %}{% if state_attr(targets[p], 'unit_of_measurement') == '°F' %}{% set goal = (goal - 32) * 5 / 9 %}{% endif %}the {{ p }} is at {{ now }} degrees{{ ', heading for ' ~ (goal | round(0) | int) if goal > 1 }}{% endmacro %}
        {% if part in t %}
          On the Klipper printer, {{ one(part) }}.
        {% else %}
          On the Klipper printer, {{ one('nozzle') }}, {{ one('bed') }}, and {{ one('chamber') }}.
        {% endif %}

# The case light is an output pin in Klipper ([output_pin caselight] in printer.cfg), a number from
# 0 to 100 in Home Assistant. As a light it dims from the dashboard and the looks like the others
# (give it the accent layer in house.toml, packages/lights.yaml). No such pin: it's just unavailable
template:
  - light:
      - name: "Klipper case light"
        unique_id: klipper_case_light
        icon: mdi:printer-3d-nozzle-outline
        state: "{{ states('number.klipper_output_pin_caselight') | float(0) > 0 }}"
        level: "{{ (states('number.klipper_output_pin_caselight') | float(0) * 2.55) | round(0) | int }}"
        availability: "{{ states('number.klipper_output_pin_caselight') not in ['unavailable', 'unknown'] }}"
        turn_on:
          - action: number.set_value
            continue_on_error: true
            target:
              entity_id: number.klipper_output_pin_caselight
            data:
              value: 100
        turn_off:
          - action: number.set_value
            continue_on_error: true
            target:
              entity_id: number.klipper_output_pin_caselight
            data:
              value: 0
        set_level:
          - action: number.set_value
            continue_on_error: true
            target:
              entity_id: number.klipper_output_pin_caselight
            data:
              value: "{{ [(brightness / 2.55) | round(0) | int, 1] | max }}"
