# What happened, kept for the morning briefing (packages/morning.yaml): every notification the
# house sends your phone, and the things worth knowing that happen while you're asleep (the
# doorbell, the front door, a print finishing or stopping, the vacuum, the backup, Home Assistant
# restarting). A briefing whose idea of overnight is a printer finishing turns a night of reminders
# or the doorbell at 2 AM into "Good morning. Dry and seventy-one."
#
# A notification that repeats within the hour (a reminder every 10 minutes, the alarm's) is one line
# with a count, and one that's been cleared by its tag is marked resolved, so the morning doesn't
# remind you of something you've already dealt with. The house going to Night leaves a marker, so overnight is everything after the last
# one. Kept for 36 hours. Times are Unix seconds, because ISO strings stop sorting right when the
# clocks change
template:
  - trigger:
      - trigger: event
        event_type: call_service
        event_data:
          domain: notify
          service: mobile_app_phone
        id: phone
      - trigger: state
        entity_id: input_datetime.doorbell_last_ring
        not_from: [unknown, unavailable]
        id: doorbell
      - trigger: state
        entity_id: binary_sensor.front_door
        from: "off"
        to: "on"
        id: door
      - trigger: state
        entity_id: sensor.bambu_print_status
        to: [finish, failed]
        id: bambu
      - trigger: state
        entity_id: sensor.klipper_current_print_state
        to: [complete, error, cancelled]
        id: klipper
      - trigger: state
        entity_id: sensor.robot_vacuum_last_clean_end
        not_from: [unknown, unavailable]
        not_to: [unknown, unavailable]
        id: vacuum
      - trigger: state
        entity_id: sensor.backup_last_successful_automatic_backup
        not_from: [unknown, unavailable]
        not_to: [unknown, unavailable]
        id: backup
      - trigger: homeassistant
        event: start
        id: restart
      - trigger: state
        entity_id: input_select.house_mode
        to: Night
        id: night
    action:
      - variables:
          asleep: "{{ is_state('input_select.house_mode', 'Night') or is_state('binary_sensor.asleep', 'on') }}"
          entry: >-
            {% set t = trigger.id %}
            {% if t == 'phone' %}
              {% set d = trigger.event.data.service_data if trigger.event.data.service_data is mapping else {} %}
              {% set msg = d.get('message', '') | string | trim %}
              {% set title = d.get('title', '') | string | trim %}
              {% set extra = d.get('data') if d.get('data') is mapping else {} %}
              {% set key = extra.get('tag') or title or msg[:30] %}
              {{ {'what': (title ~ ': ' if title else '') ~ msg[:200], 'key': 'phone:' ~ key}
                 if msg and msg != 'clear_notification' else {} }}
            {% elif t == 'doorbell' %}
              {# a ring is the helper set to now, not set back to 2000 or restored after a restart #}
              {% set rang = trigger.to_state.attributes.get('timestamp', 0) | float(0) %}
              {{ {'what': 'The doorbell rang', 'key': 'doorbell'} if (now().timestamp() - rang) | abs < 600 else {} }}
            {% elif t == 'door' %}{{ {'what': 'The front door opened', 'key': 'door'} if asleep else {} }}
            {% elif t == 'bambu' %}{{ {'what': 'The Bambu finished its print' if trigger.to_state.state == 'finish' else "The Bambu's print stopped", 'key': 'bambu'} }}
            {% elif t == 'klipper' %}{{ {'what': 'The Klipper printer finished its print' if trigger.to_state.state == 'complete' else "The Klipper printer's print stopped", 'key': 'klipper'} }}
            {% elif t == 'vacuum' %}{{ {'what': 'The vacuum cleaned', 'key': 'vacuum'} }}
            {% elif t == 'backup' %}{{ {'what': "Home Assistant's backup ran", 'key': 'backup'} }}
            {% elif t == 'restart' %}{{ {'what': 'Home Assistant restarted', 'key': 'restart'} }}
            {% elif t == 'night' %}{{ {'what': 'Night', 'key': 'night'} }}
            {% else %}{{ {} }}{% endif %}
          # a notification cleared by its tag: dealt with
          resolves: >-
            {% if trigger.id == 'phone' %}
              {% set d = trigger.event.data.service_data if trigger.event.data.service_data is mapping else {} %}
              {% set extra = d.get('data') if d.get('data') is mapping else {} %}
              {{ 'phone:' ~ extra.get('tag') if d.get('message') == 'clear_notification' and extra.get('tag') else '' }}
            {% else %}{{ '' }}{% endif %}
          entries: >-
            {% set t = now().timestamp() | round(0) %}
            {% set old = state_attr('sensor.house_log', 'entries') %}
            {% set old = old if old is list else [] %}
            {% set ns = namespace(out=[], hit=none) %}
            {% for e0 in old if e0 is mapping and e0.get('at', 0) > t - 36 * 3600 %}
              {% set e = dict(e0, resolved=t) if resolves and e0.get('key') == resolves else e0 %}
              {% if entry and e.key == entry.key and t - e.get('last', e.at) < 3600 %}
                {% set ns.hit = e %}
              {% else %}
                {% set ns.out = ns.out + [e] %}
              {% endif %}
            {% endfor %}
            {% if entry and ns.hit is not none %}
              {% set ns.out = ns.out + [dict(ns.hit, what=entry.what, last=t, n=ns.hit.get('n', 1) + 1)] %}
            {% elif entry %}
              {% set ns.out = ns.out + [dict(entry, at=t, last=t, n=1)] %}
            {% endif %}
            {{ ns.out[-40:] }}
    sensor:
      - name: "House log"
        unique_id: house_log
        icon: mdi:script-text-outline
        state: "{{ entries | count }}"
        attributes:
          entries: "{{ entries }}"
