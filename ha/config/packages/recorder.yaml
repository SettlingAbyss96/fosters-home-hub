# What the recorder keeps: everything, for a year. Home Assistant's default is ten days, and every
# night at 4:12 it deletes the oldest day for good, so a house's first weeks are gone before anyone
# thinks to look. The record of the house is worth more than the disk it takes: a house like this
# one writes something like 190,000 states a day, around 46 MB, so a year is roughly 17 GB.
# The limit that comes first is Home Assistant Cloud's: one backup, 5 GB at most, and the database
# goes in it. At that rate it's most of a year out, so older history wants an archive of its own
# before then, not a shorter year
recorder:
  purge_keep_days: 365
