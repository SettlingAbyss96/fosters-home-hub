# The morning, going off what actually happened instead of a clock.
#
# Usual wake time: with an Oura ring, every night it reports when you actually got up
# (sensor.oura_ring_bedtime_end), and this keeps the last six weeks of those, split into workdays
# and weekends, and takes the middle one of each. The Oura integration's history import has the
# sleep durations but not the times, so the log starts from scratch; until a kind of day has three
# real mornings it uses a starting guess (7:00 on workdays, 9:00 at weekends). The bedtime nudge
# plans from these (packages/bedtime.yaml). Without a ring it stays on the guesses, which the
# bedtime settings make right for workdays anyway.
#
# Morning briefing: the first time the Hub sees someone after sleeping (the house in Night, or
# nobody in front of the Hub for four hours), between 4 and 1, once a day, Jarvis says good
# morning. It's the welcome home's morning twin (packages/presence.yaml): the day ahead (the
# weather, the calendar, last night's sleep), what came through overnight (packages/house_log.yaml:
# every notification the phone got, the doorbell, the front door, a print finishing or stopping,
# the vacuum, the backup), then something nobody's said yet from the digest on the Hub, from the
# same pool as the welcome so the two never repeat each other, the news told straight and no
# maintenance or chores. Without the
# digest or a writer it's the news you asked for in house.toml, looked up by the cloud agent. A
# briefing that ends on the needs-attention list is a nag, so it doesn't. Last night's sleep is in
# it, good night or bad, once the ring's night has actually ended this morning: the ring has to sync
# before Oura knows, and a briefing quoting the night before would be worse than none. Against your
# own month it says how far off it was only past a deadband (5 points, half an hour), and the week
# against the month only when they've drifted 4 points apart, so an ordinary night is just its
# numbers. If the night lands after the briefing, the numbers come to the phone instead.
#
# The words are written ahead (script.morning_briefing_prepare), when the sunrise starts or the
# house sees you're up, and written again at the briefing when they've gone stale: older than 90
# minutes, older than something in the overnight log, or without a sleep Oura has since synced. A
# false wake (a laptop waking itself, the asleep filter letting go for an hour) otherwise gets you
# words from hours before you got up. The briefing waits up to 25 seconds for them. "Good morning",
# "brief me" or "what's my morning brief" by voice gets the same words, and once they've been said,
# asking again repeats them in full rather than the house's short version. Without a cloud agent or
# a writer it's always the house's own version.
input_datetime:
  last_morning_briefing:
    name: "Last morning briefing"
    icon: mdi:weather-sunset-up
    has_date: true
    has_time: true

input_boolean:
  briefing_missing_sleep:
    name: "Briefing went out without sleep"
    icon: mdi:sleep-off

template:
  # The briefing's words, written ahead by script.morning_briefing_prepare. "ready" is words nobody's
  # heard yet. kit is the digest's kit they came from, said_text and said_at the last briefing heard,
  # for "again"
  - trigger:
      - trigger: event
        event_type: morning_briefing_words
        id: ready
      - trigger: event
        event_type: morning_briefing_spoken
        id: spoken
    sensor:
      - name: "Morning briefing words"
        unique_id: morning_briefing_words
        icon: mdi:message-text-outline
        state: "{{ 'ready' if trigger.id == 'ready' else 'spoken' }}"
        attributes:
          text: "{{ trigger.event.data.text if trigger.id == 'ready' else '' }}"
          kit: "{{ trigger.event.data.kit | default('') if trigger.id == 'ready' else '' }}"
          written_at: >-
            {{ now().timestamp() | round(0) if trigger.id == 'ready'
               else (this.attributes.written_at | default(0)) }}
          sleep_included: >-
            {{ trigger.event.data.sleep | default(false) | bool if trigger.id == 'ready'
               else (this.attributes.sleep_included | default(false)) }}
          said_text: >-
            {{ trigger.event.data.text | default('') if trigger.id == 'spoken'
               else (this.attributes.said_text | default('')) }}
          said_at: >-
            {{ now().timestamp() | round(0) if trigger.id == 'spoken'
               else (this.attributes.said_at | default(0)) }}

  # Whether the waiting words are still good to say: from the last 90 minutes, newer than anything in
  # the overnight log, and with last night's sleep if Oura has it by now
  - binary_sensor:
      - name: "Morning briefing words fresh"
        unique_id: morning_briefing_words_fresh
        icon: mdi:message-text-clock-outline
        state: >-
          {% set w = state_attr('sensor.morning_briefing_words', 'written_at') | float(0) %}
          {% set log = state_attr('sensor.house_log', 'entries') %}
          {% set latest = ((log if log is list else []) | rejectattr('key', 'eq', 'night') | map(attribute='last') | list + [0]) | max %}
          {% set end = states('sensor.oura_ring_bedtime_end') | as_datetime(none) %}
          {% set sleep_known = end is not none and as_local(end).date() == now().date()
                               and state_attr('sensor.oura_ring_sleep_score', 'data_date') == now().date() | string %}
          {{ is_state('sensor.morning_briefing_words', 'ready') and w > 0
             and as_local(as_datetime(w)).date() == now().date() and now().timestamp() - w < 90 * 60
             and w >= latest
             and (not sleep_known or state_attr('sensor.morning_briefing_words', 'sleep_included') | bool(false)) }}

  - trigger:
      - trigger: state
        entity_id: sensor.oura_ring_bedtime_end
        to: null
      - trigger: homeassistant
        event: start
    action:
      - variables:
          samples: >-
            {% set old = state_attr('sensor.usual_wake_time', 'samples') or [] %}
            {% set w = states('sensor.oura_ring_bedtime_end') | as_datetime(none) %}
            {% if w is not none %}
              {% set w = as_local(w) %}
              {% set d = w.date() | string %}
              {% if 3 <= w.hour < 14 and d not in old | map(attribute='date') | list %}
                {% set old = (old + [{'date': d, 'workday': w.weekday() < 5, 'min': w.hour * 60 + w.minute}])[-42:] %}
              {% endif %}
            {% endif %}
            {{ old }}
          usual: >-
            {% set ns = namespace(out={}) %}
            {% for kind, seed in [(true, 420), (false, 540)] %}
              {% set mins = samples | selectattr('workday', 'eq', kind) | map(attribute='min') | sort | list %}
              {% set key = 'workday' if kind else 'weekend' %}
              {% set ns.out = dict(ns.out, **{key: mins[(mins | count) // 2] if mins | count >= 3 else seed, key ~ '_n': mins | count}) %}
            {% endfor %}
            {{ ns.out }}
    sensor:
      - name: "Usual wake time"
        unique_id: usual_wake_time
        icon: mdi:alarm
        state: "{{ '%02d:%02d' | format(usual.workday // 60, usual.workday % 60) }}"
        attributes:
          samples: "{{ samples }}"
          workday_minutes: "{{ usual.workday }}"
          weekend_minutes: "{{ usual.weekend }}"
          weekend: "{{ '%02d:%02d' | format(usual.weekend // 60, usual.weekend % 60) }}"
          learned_workdays: "{{ usual.workday_n }}"
          learned_weekends: "{{ usual.weekend_n }}"

script:
  morning_briefing_text:
    alias: "Morning briefing (words)"
    icon: mdi:text-box-outline
    mode: parallel
    sequence:
      - if: "{{ states('calendar.work') not in ['unavailable', 'unknown'] }}"
        then:
          - action: calendar.get_events
            target:
              entity_id: calendar.work
            data:
              start_date_time: "{{ now().isoformat() }}"
              end_date_time: "{{ (today_at('23:59')).isoformat() }}"
            response_variable: cal
            continue_on_error: true
      - variables:
          fresh: >-
            {% set end = states('sensor.oura_ring_bedtime_end') | as_datetime(none) %}
            {{ end is not none and as_local(end).date() == now().date()
               and state_attr('sensor.oura_ring_sleep_score', 'data_date') == now().date() | string }}
          # last night, good or bad, against your own month (packages/health.yaml), the comparison only
          # past a deadband so an ordinary night is just its numbers
          sleep: >-
            {% if fresh %}
              {% set score = states('sensor.oura_ring_sleep_score') | int(0) %}
              {% set m = (states('sensor.oura_ring_total_sleep_duration') | float(0) * 60) | round(0) | int %}
              {% set r = states('sensor.oura_ring_readiness_score') if state_attr('sensor.oura_ring_readiness_score', 'data_date') == now().date() | string else none %}
              {% set month = state_attr('sensor.health_trends', 'sleep_score_30d') %}
              {% set month_h = state_attr('sensor.health_trends', 'sleep_hours_30d') %}
              {% set week = state_attr('sensor.health_trends', 'sleep_score_7d') %}
              You slept {{ m // 60 }} hours {{ m % 60 }}, sleep score {{ score }}{{ ', readiness ' ~ r if r not in [none, 'unknown', 'unavailable'] else '' }}.
              {% if month is number and (score - month) | abs >= 5 %}
                {% set dh = m / 60 - (month_h | float(0)) %}
                That's {{ (score - month) | abs | round(0) | int }} points {{ 'under' if score < month else 'over' }} your 30-day average of {{ month | round(0) | int }}{{ (', and ' ~ ((dh | abs * 60) | round(0) | int) ~ ' minutes ' ~ ('less' if dh < 0 else 'more') ~ ' sleep than usual') if month_h is number and dh | abs >= 0.5 else '' }}.
              {% endif %}
              {% if week is number and month is number and (week - month) | abs >= 4 %}
                This week's average is {{ week | round(0) | int }}, against {{ month | round(0) | int }} for the month.
              {% endif %}
            {% endif %}
          weather: >-
            {% set w = states('sensor.today_s_weather') %}
            {% if w not in ['unknown', 'unavailable', ''] %}
              {% set parts = (w | replace('°', '')).split(' · ') %}
              {{ (parts | join(', ')) | lower | regex_replace('^h', 'H') }}.
            {% endif %}
          meetings: >-
            {% set evs = (cal['calendar.work'].events if cal is defined and cal and 'calendar.work' in cal else []) %}
            {% if evs | count == 0 %}Nothing on the calendar.
            {% else %}
              {% set first = as_local(as_datetime(evs[0].start)) %}
              First meeting at {{ first.strftime('%-I:%M') | replace(':00', '') }}{{ ', ' ~ (evs | count) ~ ' today' if evs | count > 1 else '' }}.
            {% endif %}
          laundry: >-
            {% set w = states('input_datetime.washer_done_at') | as_datetime(none) %}
            {% if w is not none and (now() - as_local(w)).total_seconds() < 10 * 3600 and as_local(w).hour < 6 or (w is not none and (now() - as_local(w)).total_seconds() < 10 * 3600 and as_local(w).hour >= 21) %}The washing finished at {{ as_local(w).strftime('%-I:%M') }}, it's waiting for you.{% endif %}
          # what came through overnight (packages/house_log.yaml): everything after the house last
          # went to Night, or the last ten hours when there's no Night in the last sixteen, less the
          # alarm's own nudges, which are this morning rather than news. Dozing off with the lights
          # on used to be here too, and it's a nag, so it isn't logged
          overnight: >-
            {% set log = state_attr('sensor.house_log', 'entries') %}
            {% set log = log if log is list else [] %}
            {% set t = now().timestamp() %}
            {% set marks = log | selectattr('key', 'eq', 'night') | map(attribute='at') | list %}
            {% set since = marks | last if marks and t - marks | last < 16 * 3600 else t - 10 * 3600 %}
            {# a notification that's since been dealt with (the car unplugged) isn't a second reminder #}
            {% set kept = namespace(items=[]) %}
            {% for e in log if e.get('key') != 'night' and e.get('last', 0) > since and not e.get('resolved')
                             and not (e.get('what', '') is search('^(Wake up|Still up)')) %}
              {% set kept.items = kept.items + [e] %}
            {% endfor %}
            {% set items = kept.items %}
            {% for e in items %}{{ e.what | trim('. ') }} at {{ as_local(as_datetime(e.at)).strftime('%-I:%M') }}{{ (', ' ~ e.n ~ ' times, the last at ' ~ as_local(as_datetime(e.last)).strftime('%-I:%M')) if e.n > 1 else '' }}{{ '. ' if loop.last else '; ' }}{% endfor %}
          day: >-
            {{ ([sleep, weather, meetings, laundry] | map('trim') | reject('eq', '') | join(' ')) }}
          notes: >-
            {{ ([day, ('Overnight: ' ~ overnight | trim) if overnight | trim else ''] | map('trim') | reject('eq', '') | join(' ')) }}
          result:
            text: "{{ ('Good morning«, sir». ' ~ notes) | trim }}"
            notes: "{{ notes }}"
            day: "{{ day }}"
            overnight: "{{ overnight | trim }}"
            sleep_included: "{{ fresh }}"
      - stop: "Done"
        response_variable: result

  morning_briefing:
    alias: "Morning briefing"
    description: "Jarvis says good morning on the Hub: the day ahead, the night, then a little news, told straight. No maintenance or chores."
    icon: mdi:weather-sunset-up
    mode: single
    sequence:
      # stale words (binary_sensor.morning_briefing_words_fresh) get written again, and they get
      # twenty-five seconds
      - if: >-
          {{ not is_state('binary_sensor.morning_briefing_words_fresh', 'on')
             and (states.conversation.jarvis_cloud is not none or states.ai_task.jarvis_writer is not none) }}
        then:
          - variables:
              before: "{{ state_attr('sensor.morning_briefing_words', 'written_at') | float(0) }}"
          - action: script.turn_on
            continue_on_error: true
            target:
              entity_id: script.morning_briefing_prepare
            data:
              variables:
                force: true
          - wait_template: "{{ state_attr('sensor.morning_briefing_words', 'written_at') | float(0) > before }}"
            timeout: 25
      # the house's own short version, for when there are no words. Today's older words beat it, if
      # writing them again didn't work
      - action: script.morning_briefing_text
        response_variable: house
      - variables:
          fresh: >-
            {% set w = state_attr('sensor.morning_briefing_words', 'written_at') | float(0) %}
            {{ is_state('sensor.morning_briefing_words', 'ready') and w > 0
               and as_local(as_datetime(w)).date() == now().date() }}
          message: "{{ state_attr('sensor.morning_briefing_words', 'text') if fresh else house.text }}"
          sleep_included: "{{ state_attr('sensor.morning_briefing_words', 'sleep_included') if fresh else house.sleep_included }}"
      - action: assist_satellite.announce
        continue_on_error: true
        target:
          entity_id: assist_satellite.hub_500_voice_assist_satellite
        data:
          message: "{{ message }}"
          preannounce: false
      - event: morning_briefing_spoken
        event_data:
          text: "{{ message }}"
          kit: "{{ (state_attr('sensor.morning_briefing_words', 'kit') or '') if fresh else '' }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.last_morning_briefing
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: "input_boolean.turn_{{ 'off' if sleep_included | bool else 'on' }}"
        target:
          entity_id: input_boolean.briefing_missing_sleep

  # The briefing's words. What to talk about comes from the digest on the Hub, like the welcome home
  # (packages/digest.yaml), written up by the AI task (voice.writer in house.toml), which has no tools.
  # The day ahead and the night come from the house. Without the digest or the writer, or nothing
  # written from them, it's the cloud agent looking up input_text.news
  morning_briefing_prepare:
    alias: "Morning briefing, the words"
    description: "Jarvis writes the morning briefing ahead of time: the day ahead, what came through overnight, then something nobody's said yet from the digest, or the news from input_text.news without it."
    icon: mdi:message-text-clock-outline
    mode: single
    max_exceeded: silent
    fields:
      force:
        description: "Write them again even if there are words from the last 90 minutes"
        selector:
          boolean:
    sequence:
      # once a morning, until it's been said: not while there are words from the last 90 minutes,
      # unless the briefing asks for them again (force)
      - condition: >-
          {% set w = state_attr('sensor.morning_briefing_words', 'written_at') | float(0) %}
          {% set said = states('input_datetime.last_morning_briefing') | as_datetime(none) %}
          {{ is_state('input_boolean.auto_briefing', 'on')
             and (said is none or as_local(said).date() < now().date())
             and (force | default(false) | bool
                  or not (is_state('sensor.morning_briefing_words', 'ready') and now().timestamp() - w < 90 * 60))
             and (states.conversation.jarvis_cloud is not none or states.ai_task.jarvis_writer is not none) }}
      - action: script.morning_briefing_text
        response_variable: house
      - variables:
          who: "{{ state_attr('person.resident', 'friendly_name') or 'The resident' }}"
          kit: {}
          words: ""
          ask: >-
            {% set name = state_attr('person.resident', 'friendly_name') or 'The resident' %}
            {% set news = states('input_text.news') %}
            {% set likes = states('input_text.interests') %}
            {% set news = news if news not in ['', 'unknown', 'unavailable'] else '' %}
            {% set likes = likes if likes not in ['', 'unknown', 'unavailable'] else '' %}
            It's {{ now().strftime('%-I:%M %p on %A') }} and {{ name }} is getting up. Write exactly what you'll say
            out loud as the morning briefing: four or five short spoken sentences, about twenty seconds. Start with
            "Good morning«, sir»." Then the day ahead and anything that came through overnight, from the notes below, in a
            sentence or two, calmly.
            {% if news %}Then look up {{ news }}{{ ', and if there is room one item from something else they are into (' ~ likes ~ ')' if likes else '' }},
            each in one sentence in your own words. It is {{ 'the weekend, so anything that only happens on weekdays means its last session' if now().weekday() >= 5 else 'a weekday' }}.{% endif %}
            For anything you report, say how it went and why, a bad day included: stocks sliding on
            interest rate worries is worth knowing. Calm and plain, no hype and no doom-mongering. Nothing about the
            house's maintenance or chores, no reminders. Mention last night's sleep only if the notes do. Don't end on a question and
            don't offer anything. Notes: {{ (house.notes | trim) or 'Nothing in particular.' }}
      # the kit, from the digest on the Hub, when there's a Hub address and a writer for it
      - if: "{{ states.ai_task.jarvis_writer is not none and states('input_text.hub_address') not in ['', 'unknown', 'unavailable'] }}"
        then:
          - action: rest_command.digest_kit
            continue_on_error: true
            data:
              occasion: morning
              late: 0
              name: "{{ who }}"
            response_variable: digest
          - variables:
              kit: >-
                {% set c = (digest if digest is defined and digest is mapping else {}).get('content') %}
                {{ c if c is mapping and c.get('kit') and c.get('brief') else {} }}
          - if: "{{ kit | length > 0 }}"
            then:
              - action: ai_task.generate_data
                continue_on_error: true
                data:
                  task_name: morning briefing
                  entity_id: ai_task.jarvis_writer
                  instructions: >-
                    You are Jarvis, the home's assistant, in the spirit of J.A.R.V.I.S. from Iron Man:
                    composed, precise, loyal, with a dry wit used sparingly. It's
                    {{ now().strftime('%-I:%M %p on %A') }} and {{ who }} is getting up. Write exactly
                    what you'll say out loud as the morning briefing, and nothing else,
                    «calling them "sir"|calling them {{ who }} if anything». Start with "Good morning«, sir»."
                    Then three things, in the order the
                    brief asks for: the day ahead from its notes (the weather, the calendar, and last
                    night's sleep if the notes have it, honestly, good or bad, with the comparison if the
                    notes give one and no advice) in a sentence or two; what came through overnight
                    from its notes, the phone's notifications included, in a sentence or two, calmly and
                    in plain words, leaving out anything that's plainly over and saying nothing if nothing
                    came through; and the material below, {{ kit.get('length') }}, the way the brief says.
                    Say it the way a person would out loud: no lists, links or headlines read out word for
                    word, numbers the way you'd say them, and who's behind each thing. Tell the news straight, bad as well as good: if stocks slid on interest rate
                    worries, say they slid and why, because that's what they'll want to know, and say
                    who argues what, leaving the decisions to them. Calm and plain, no hype and no
                    doom-mongering. What stays out is the house's upkeep: no maintenance reminders or
                    chores (the printers, the vacuum), which they already know about and have in hand.
                    Last night's sleep only if the notes have it. Don't end on a question and don't offer
                    anything.
                    The day ahead: {{ house.day | trim or 'Nothing in particular.' }}
                    Overnight: {{ house.overnight | trim or 'Nothing came through.' }}

                    {{ kit.get('brief') }}
                response_variable: wrote
              - variables:
                  words: >-
                    {% set w = (wrote if wrote is defined and wrote is mapping else {}).get('data') %}
                    {{ w | trim if w is string else '' }}
      # no kit, or nothing written from it: the cloud agent looks the news up, the old way
      - if: "{{ words | length <= 20 and states.conversation.jarvis_cloud is not none }}"
        then:
          - variables:
              kit: {}
          - action: conversation.process
            continue_on_error: true
            data:
              agent_id: conversation.jarvis_cloud
              text: "{{ ask }}"
            response_variable: said
          - variables:
              words: >-
                {{ ((said if said is defined and said is mapping else {}).get('response') or {}).get('speech', {}).get('plain', {}).get('speech', '') | trim }}
      - condition: "{{ words | length > 20 and '(no reply)' not in words }}"
      - event: morning_briefing_words
        event_data:
          text: "{{ words }}"
          sleep: "{{ house.sleep_included }}"
          kit: "{{ kit.get('kit', '') }}"

automation:
  # the words, ahead of time: when the sunrise starts, or on a day without one, the moment the house
  # sees I'm up (the asleep estimate letting go, or Night ending)
  - id: morning_briefing_written_ahead
    alias: "Morning briefing, written ahead"
    triggers:
      - trigger: state
        entity_id: input_boolean.waking_up
        to: "on"
      - trigger: state
        entity_id: binary_sensor.asleep
        from: "on"
        to: "off"
      - trigger: state
        entity_id: input_select.house_mode
        from: Night
    conditions:
      - condition: time
        after: "04:00:00"
        before: "13:00:00"
      - condition: state
        entity_id: person.resident
        state: home
    actions:
      - action: script.turn_on
        continue_on_error: true
        target:
          entity_id: script.morning_briefing_prepare

  # Up is the house's own call (packages/house_mode.yaml): out of Night, which the wake-up does at
  # the wake time and the Hub seeing someone does from 45 minutes before the plan's wake on a day
  # off. Going by the first movement after 4 AM, a few minutes up at 4:00, an hour and a half before
  # the alarm, gets the whole briefing in an empty room and nothing when you're really up, since
  # it's once a day. The Hub seeing someone and Night ending come in either order, so either one
  # can start it
  - id: morning_briefing_when_up
    alias: "Morning briefing when I'm up"
    triggers:
      - trigger: state
        entity_id: binary_sensor.hub_500_motion
        from: "off"
        to: "on"
      - trigger: state
        entity_id: input_select.house_mode
        from: Night
        id: up
    conditions:
      - condition: state
        entity_id: input_boolean.auto_briefing
        state: "on"
      - condition: time
        after: "04:00:00"
        before: "13:00:00"
      - condition: state
        entity_id: person.resident
        state: home
      - "{{ (states('input_datetime.last_morning_briefing') | as_datetime(none)) is none or (states('input_datetime.last_morning_briefing') | as_datetime | as_local).date() < now().date() }}"
      # out of Night and up: Night ended today (the wake-up, or seen in the morning window), or no
      # Night at all and nobody moved in front of the Hub for four hours. Night ending counts when
      # the Hub has just seen someone, since the wake-up ends it while you're still in bed
      - >-
        {% set quiet = state_attr('sensor.hub_last_saw_someone', 'last_off') | as_datetime(none) %}
        {% set mode = states.input_select.house_mode %}
        {% set seen = states('sensor.hub_last_saw_someone') | as_datetime(none) %}
        {{ mode is not none and mode.state not in ['Night', 'Away']
           and (trigger.id != 'up' or (seen is not none and (now() - seen).total_seconds() < 120))
           and (is_state('input_boolean.waking_up', 'on') or as_local(mode.last_changed).date() == now().date()
                or quiet is none or (now() - quiet).total_seconds() > 4 * 3600) }}
    actions:
      - action: script.morning_briefing
        continue_on_error: true

  # heard, so the digest retires everything in the kit (the same pool as the welcome home's)
  - id: morning_briefing_told
    alias: "Morning briefing heard, the digest retires it"
    triggers:
      - trigger: event
        event_type: morning_briefing_spoken
    conditions:
      - "{{ (trigger.event.data.kit | default('')) != '' }}"
    actions:
      - action: rest_command.digest_told
        continue_on_error: true
        data:
          kit: "{{ trigger.event.data.kit }}"
          words: "{{ trigger.event.data.text | default('') }}"

  - id: morning_sleep_arrives_later
    alias: "Last night's sleep, when Oura has it"
    triggers:
      - trigger: state
        entity_id: sensor.oura_ring_sleep_score
        to: null
    conditions:
      - condition: state
        entity_id: input_boolean.auto_briefing
        state: "on"
      - condition: state
        entity_id: input_boolean.briefing_missing_sleep
        state: "on"
      - "{{ state_attr('sensor.oura_ring_sleep_score', 'data_date') == now().date() | string and now().hour < 14 }}"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.briefing_missing_sleep
      - variables:
          m: "{{ (states('sensor.oura_ring_total_sleep_duration') | float(0) * 60) | round(0) | int }}"
      - action: notify.mobile_app_phone
        continue_on_error: true
        data:
          title: "Last night"
          message: >-
            {{ m // 60 }} h {{ m % 60 }} min, sleep score {{ states('sensor.oura_ring_sleep_score') }}, readiness {{ states('sensor.oura_ring_readiness_score') }}.

intent_script:
  MorningBriefing:
    description: "The morning briefing: the day ahead, what came through overnight and a little news. Asked again, today's briefing again."
    action:
      # saying good morning at the Hub means you're up: the wake-up alarm stops, Night ends
      - event: wake_up_confirmed
      - if: "{{ is_state('input_select.house_mode', 'Night') }}"
        then:
          - action: script.house_mode_set
            continue_on_error: true
            data:
              mode: Morning
      # already said today: the same briefing again, in full, rather than the house's short version
      - variables:
          said_today: >-
            {% set at = state_attr('sensor.morning_briefing_words', 'said_at') | float(0) %}
            {{ at > 0 and as_local(as_datetime(at)).date() == now().date()
               and (state_attr('sensor.morning_briefing_words', 'said_text') or '') | length > 20 }}
      # not yet: the words if they're fresh, otherwise written now. The AI task takes about three
      # seconds, and after twelve it's the house's own short version, since a long silence is no
      # answer to "good morning"
      - if: >-
          {{ not said_today and not is_state('binary_sensor.morning_briefing_words_fresh', 'on')
             and (states.conversation.jarvis_cloud is not none or states.ai_task.jarvis_writer is not none) }}
        then:
          - variables:
              before: "{{ state_attr('sensor.morning_briefing_words', 'written_at') | float(0) }}"
          - action: script.turn_on
            continue_on_error: true
            target:
              entity_id: script.morning_briefing_prepare
            data:
              variables:
                force: true
          - wait_template: "{{ state_attr('sensor.morning_briefing_words', 'written_at') | float(0) > before }}"
            timeout: 12
      - action: script.morning_briefing_text
        response_variable: house
      - variables:
          ready: >-
            {% set w = state_attr('sensor.morning_briefing_words', 'written_at') | float(0) %}
            {{ is_state('sensor.morning_briefing_words', 'ready') and w > 0 and as_local(as_datetime(w)).date() == now().date() }}
          result:
            text: >-
              {{ state_attr('sensor.morning_briefing_words', 'said_text') if said_today
                 else (state_attr('sensor.morning_briefing_words', 'text') if ready else house.text) }}
      # said is said: the Hub doesn't give it again when it next sees me
      - if: "{{ not said_today }}"
        then:
          - event: morning_briefing_spoken
            event_data:
              text: "{{ result.text }}"
              kit: "{{ (state_attr('sensor.morning_briefing_words', 'kit') or '') if ready else '' }}"
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.last_morning_briefing
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - stop: "Done"
        response_variable: result
    speech:
      text: "{{ action_response.text if action_response is defined else 'Good morning«, sir».' }}"
